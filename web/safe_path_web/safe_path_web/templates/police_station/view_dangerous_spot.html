{% extends "police_station/index.html" %}
{% block body %}
<style>
    .admin-container {
        padding: 25px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 15px;
        border-bottom: 2px solid #eaeaea;
    }

    .admin-title {
        font-size: 1.8rem;
        color: #1a2980;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .admin-title i {
        color: #26d0ce;
        background: #f0f8ff;
        padding: 12px;
        border-radius: 50%;
    }

    .add-btn {
        background: linear-gradient(to right, #1a2980, #26d0ce);
        color: white;
        padding: 12px 25px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(26, 41, 128, 0.15);
    }

    .add-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 18px rgba(26, 41, 128, 0.25);
        color: white;
        text-decoration: none;
    }

    .table-container {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        margin-top: 20px;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
    }

    .data-table thead {
        background: linear-gradient(to right, #1a2980, #26d0ce);
        color: white;
    }

    .data-table thead th {
        padding: 18px 20px;
        text-align: left;
        font-weight: 600;
        font-size: 1.05rem;
        border: none;
    }

    .data-table thead th:first-child {
        border-radius: 12px 0 0 0;
    }

    .data-table thead th:last-child {
        border-radius: 0 12px 0 0;
    }

    .data-table tbody tr {
        border-bottom: 1px solid #f0f0f0;
        transition: all 0.3s;
    }

    .data-table tbody tr:hover {
        background-color: #f8fafc;
    }

    .data-table tbody tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    .data-table tbody tr:nth-child(even):hover {
        background-color: #f0f8ff;
    }

    .data-table tbody td {
        padding: 16px 20px;
        color: #333;
        font-size: 1rem;
    }

    .data-table tbody td:first-child {
        font-weight: 600;
        color: #1a2980;
    }

    .action-buttons {
        display: flex;
        gap: 10px;
    }

    .btn-edit {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s;
        border: 1px solid #c8e6c9;
    }

    .btn-edit:hover {
        background: #d4edda;
        color: #1b5e20;
        text-decoration: none;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(46, 125, 50, 0.1);
    }

    .btn-delete {
        background: #ffebee;
        color: #c62828;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s;
        border: 1px solid #ffcdd2;
    }

    .btn-delete:hover {
        background: #f8d7da;
        color: #b71c1c;
        text-decoration: none;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(198, 40, 40, 0.1);
    }

    .no-data {
        text-align: center;
        padding: 40px !important;
        color: #666;
        font-style: italic;
    }

    .no-data i {
        font-size: 3rem;
        color: #ddd;
        margin-bottom: 15px;
        display: block;
    }

    .stats-bar {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .stat-card {
        background: white;
        padding: 18px 25px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 15px;
        flex: 1;
        min-width: 200px;
    }

    .stat-icon {
        background: #f0f8ff;
        color: #1a2980;
        width: 50px;
        height: 50px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
    }

    .stat-info h3 {
        margin: 0;
        font-size: 1.8rem;
        color: #1a2980;
        font-weight: 700;
    }

    .stat-info p {
        margin: 5px 0 0;
        color: #666;
        font-size: 0.9rem;
    }

    /* Responsive Design */
    @media (max-width: 992px) {
        .table-container {
            overflow-x: auto;
        }

        .data-table {
            min-width: 800px;
        }
    }

    @media (max-width: 768px) {
        .admin-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .add-btn {
            align-self: flex-start;
        }

        .stats-bar {
            flex-direction: column;
        }

        .stat-card {
            width: 100%;
        }
    }

    /* Status indicators */
    .status-active {
        display: inline-block;
        padding: 5px 12px;
        background: #e8f5e9;
        color: #2e7d32;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
    }

    .status-inactive {
        display: inline-block;
        padding: 5px 12px;
        background: #fff3e0;
        color: #ef6c00;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
    }
</style>

<div class="admin-container">
    <div class="admin-header">
        <div class="admin-title">
            <i class="fas fa-user-shield"></i>
            <span>Manage Dangerous Spot</span>
        </div>
    </div>


    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>PLACE NAME</th>
                    <th>LOCATION</th>
                    <th colspan="2">ACTIONS</th>
                </tr>
            </thead>
            <tbody>
                {% if data %}
                    {% for i in data %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div style="width: 36px; height: 36px; background: #f0f8ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1a2980;">
                                    <i class="fas fa-location"></i>
                                </div>
                                <div>
                                    <strong>{{ i.place_name }}</strong>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <a href="http://maps.google.com/?q={{ i.latitude }},{{ i.longitude }}" style="color: #333; text-decoration: none;">
                                    Locate
                                </a>
                            </div>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <a href="/pol_edit_dangerous_spot/{{ i.id }}#content" class="btn-edit">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <a href="/pol_delete_dangerous_spot/{{ i.id }}" class="btn-delete" onclick="return confirmDelete()">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="6" class="no-data">
                            <i class="fas fa-building"></i>
                            <h3 style="margin: 10px 0; color: #666;">No Dangerous Spots Found</h3>
                        </td>
                    </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</div>

<script>
    function confirmDelete() {
        return confirm('Are you sure?');
    }
</script>
{% endblock %}
