{% extends "admin/index.html" %}
{% block body %}
<style>
    .admin-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 30px;
    }

    .admin-header {
        background: linear-gradient(to right, #1a2980, #26d0ce);
        color: white;
        padding: 25px;
        border-radius: 12px 12px 0 0;
        margin-bottom: 0;
    }

    .admin-header h2 {
        margin: 0;
        font-size: 1.8rem;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .admin-header h2 i {
        color: #26d0ce;
        background: white;
        padding: 10px;
        border-radius: 50%;
    }

    .form-card {
        background: white;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
    }

    .form-row {
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 30px;
        gap: 20px;
    }

    .form-group {
        flex: 1;
        min-width: 300px;
    }

    .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #333;
        font-size: 1.05rem;
    }

    .form-group label i {
        color: #1a2980;
        margin-right: 8px;
        width: 20px;
    }

    .form-input {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e1e8ed;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s;
        background-color: #f8fafc;
    }

    .form-input:focus {
        border-color: #26d0ce;
        outline: none;
        box-shadow: 0 0 0 3px rgba(38, 208, 206, 0.2);
        background-color: white;
    }

    .form-input:valid {
        border-color: #4CAF50;
    }

    .input-hint {
        display: block;
        margin-top: 6px;
        font-size: 0.85rem;
        color: #666;
        font-style: italic;
    }

    .input-hint.error {
        color: #f44336;
    }

    .input-hint.success {
        color: #4CAF50;
    }

    .btn-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #eaeaea;
    }

    .btn-submit {
        background: linear-gradient(to right, #1a2980, #26d0ce);
        color: white;
        border: none;
        padding: 16px 40px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(26, 41, 128, 0.2);
    }

    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(26, 41, 128, 0.3);
        background: linear-gradient(to right, #16236b, #1fb9b7);
    }

    .btn-reset {
        background: #f5f7fa;
        color: #666;
        border: 2px solid #ddd;
        padding: 16px 40px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .btn-reset:hover {
        background: #eaeaea;
        color: #333;
    }

    .form-note {
        background: #e8f4fd;
        border-left: 4px solid #1a2980;
        padding: 15px;
        border-radius: 4px;
        margin-top: 25px;
        font-size: 0.95rem;
        color: #333;
    }

    .form-note h4 {
        margin-top: 0;
        color: #1a2980;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .required-mark {
        color: #f44336;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .admin-container {
            padding: 15px;
        }

        .form-card {
            padding: 25px;
        }

        .form-row {
            flex-direction: column;
            gap: 25px;
        }

        .form-group {
            min-width: 100%;
        }

        .btn-container {
            flex-direction: column;
        }

        .btn-submit, .btn-reset {
            width: 100%;
            justify-content: center;
        }
    }

    /* Validation states */
    .valid-feedback {
        color: #4CAF50;
        font-size: 0.9rem;
        margin-top: 5px;
        display: none;
    }

    .invalid-feedback {
        color: #f44336;
        font-size: 0.9rem;
        margin-top: 5px;
        display: none;
    }

    .was-validated .form-input:valid {
        border-color: #4CAF50;
    }

    .was-validated .form-input:valid ~ .valid-feedback {
        display: block;
    }

    .was-validated .form-input:invalid {
        border-color: #f44336;
    }

    .was-validated .form-input:invalid ~ .invalid-feedback {
        display: block;
    }
</style>

<div class="admin-container">
    <div class="admin-header">
        <h2><i class="fas fa-user-shield"></i> Edit Police Station</h2>
    </div>

    <div class="form-card">
        <form method="post" action="/adm_edit_police_station_post/{{ data.id }}" enctype="multipart/form-data" id="authorityForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Full Name <span class="required-mark">*</span></label>
                    <input type="text"
                           id="name"
                           name="textfield"
                           class="form-input"
                           placeholder="Enter police station name"
                           required value="{{ data.name }}"
                           pattern="[A-Za-z\s]{3,50}" />
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> Phone Number <span class="required-mark">*</span></label>
                    <input type="tel"
                           id="phone"
                           name="textfield3"
                           class="form-input"
                           placeholder="9876543210"
                           required value="{{ data.phone }}"
                           pattern="[6789][0-9]{9}"
                           maxlength="10" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address <span class="required-mark">*</span></label>
                    <input type="email"
                           id="email"
                           name="textfield2"
                           class="form-input" value="{{ data.email }}"
                           placeholder="authority@example.com"
                           required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Place <span class="required-mark">*</span></label>
                    <input type="text"
                           id="textfield4"
                           name="textfield4"
                           class="form-input"
                           placeholder="Enter place"
                           required value="{{ data.place }}"
                           pattern="[A-Za-z\s]{3,50}" />
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Post <span class="required-mark">*</span></label>
                    <input type="text"
                           id="textfield5"
                           name="textfield5"
                           class="form-input" value="{{ data.post }}"
                           placeholder="Enter post"
                           required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Pin <span class="required-mark">*</span></label>
                    <input type="text"
                           id="textfield6"
                           name="textfield6"
                           class="form-input"
                           placeholder="Enter pincode" value="{{ data.pin }}"
                           required maxlength="6"
                           pattern="[6][0-9]{5}" />
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> District <span class="required-mark">*</span></label>
                    <input type="text"
                           id="textfield7"
                           name="textfield7"
                           class="form-input" value="{{ data.district }}"
                           placeholder="Enter district"
                           required />
                </div>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus"></i> Update Police Station
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
